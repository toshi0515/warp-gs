[project]
name = "warpgs"
version = "0.1.0"
description = "Differentiable 3D Gaussian Splatting rasterizer in NVIDIA Warp, with a moderngl viewer"
readme = "README.md"
authors = [
    { name = "Toshi-0515", email = "161176815+toshi0515@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gsplat>=1.5.3",
    "japanize-matplotlib>=1.1.3",
    "matplotlib>=3.11.1",
    "moderngl>=5.12.0",
    "moderngl-window>=3.1.1",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "plyfile>=1.1.5",
    "pyglm>=2.8.3",
    "torch>=2.6.0",
    "warp-lang>=1.16.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=8",
    "ruff>=0.8",
]
baseline = ["gsplat>=1.5.3"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pyrefly.errors]
bad-override-mutable-attribute = false

[[tool.pyrefly.sub-config]]
matches = "viewers/*.py"

[tool.pyrefly.sub-config.errors]
bad-argument-type = false
unsupported-operation = false
no-matching-overload = false
bad-index = false
bad-specialization = false
not-iterable = false
bad-unpacking = false
missing-attribute = false

[[tool.pyrefly.sub-config]]
matches = "src/warpgs/my_warp_rasterizer.py"

[tool.pyrefly.sub-config.errors]
bad-argument-type = false
unsupported-operation = false
no-matching-overload = false
bad-index = false
bad-specialization = false
not-iterable = false
bad-unpacking = false
missing-attribute = false